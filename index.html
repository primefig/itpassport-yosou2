const ROWS=TOPICS.split('\n').map((x,i)=>{const [topic,subcategory]=x.split('|');return {n:i+1,topic,subcategory,domain:i<28?'ストラテジ系':i<48?'マネジメント系':'テクノロジ系',cls:i<28?'strategy':i<48?'management':'technology'};});
if(ROWS.length!==80) throw new Error('問題数が80ではありません');
const STORE='itpassport-yosou2-answer-v1';
const KANA=['ア','イ','ウ','エ'];
// ユーザーから提供された公式解答例PDFを80問照合した正答データ。
// 解答を確定する前は画面・エクスポートには表示しない。
const OFFICIAL_KEYS="アウエエエエイエウウアウエイイイエイウウアイウウエイアイウイアエウウウエイウイアウイイアアエイエエウアエイイウアイウエエアイアイウエエウイイエアウイウイイイウエ".split('');
if(OFFICIAL_KEYS.length!==80||OFFICIAL_KEYS.some(k=>!KANA.includes(k)))throw new Error('正答データを検証できません');
// 問題PDFをIndexedDBに保存：GitHub Pages側には送信しない。
const PDF_DB_NAME='itpassport-yosou2-local-pdf';
let pdfReady=false, pdfBusy=true, pdfObjectUrl=null;
function openPdfDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('このブラウザではPDFの保存機能を利用できません。'));const req=indexedDB.open(PDF_DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('attachments'))req.result.createObjectStore('attachments');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function fetchSavedPdf(){const db=await openPdfDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('attachments','readonly');const q=tx.objectStore('attachments').get('questions');q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error);});}finally{db.close();}}
async function savePdfFile(file){const db=await openPdfDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction('attachments','readwrite');tx.objectStore('attachments').put(file,'questions');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}finally{db.close();}}
function setPdfUrl(file){if(pdfObjectUrl)URL.revokeObjectURL(pdfObjectUrl);pdfObjectUrl=file?URL.createObjectURL(file):null;pdfReady=!!file;pdfBusy=false;render();}
async function initPdf(){try{const file=await fetchSavedPdf();setPdfUrl(file);}catch(e){console.warn('PDF storage unavailable:',e);pdfBusy=false;render();}}
// 高速モード: ユーザーが取り込んだ「1問ずつの軽量画像」をIndexedDBに保存・表示する。
// 問題画像はGitHub Pagesにアップロードしない。解答データのSTOREは変更しない。
const FAST_FORMAT='itpassport-yosou2-fast-pages';
let fastPagesReady=false,fastZoom=1,fastImageUrl=null,fastImageQuestion=0,fastImageGeneration=0;
async function getFastImage(n){const db=await openPdfDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('attachments','readonly');const q=tx.objectStore('attachments').get('fast-question-'+n);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error);});}finally{db.close();}}
async function initFastPages(){try{const db=await openPdfDB();try{const has=await new Promise((resolve,reject)=>{const q=db.transaction('attachments','readonly').objectStore('attachments').get('fast-pages-version');q.onsuccess=()=>resolve(q.result===1);q.onerror=()=>reject(q.error);});fastPagesReady=has;}finally{db.close();}}catch(e){console.warn('Fast image cache unavailable',e);}render();}
function decodeBase64WebP(data){const binary=atob(data);const output=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)output[i]=binary.charCodeAt(i);return new Blob([output],{type:'image/webp'});}
async function importFastPages(file){const o=JSON.parse(await file.text());if(o.format!==FAST_FORMAT||o.version!==1||o.mime!=='image/webp'||!Array.isArray(o.images)||o.images.length!==80)throw Error('予想問題2用の高速表示データを選んでください。');
 const blobs=o.images.map((x,i)=>{if(typeof x!=='string'||x.length<1000)throw Error('問'+(i+1)+'の画像データが不正です。');return decodeBase64WebP(x);});
 const db=await openPdfDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction('attachments','readwrite');const st=tx.objectStore('attachments');for(let i=0;i<80;i++)st.put(blobs[i],'fast-question-'+(i+1));st.put(1,'fast-pages-version');tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('保存が中断されました'));tx.onerror=()=>reject(tx.error||Error('保存できませんでした'));});}finally{db.close();}
 fastPagesReady=true;fastImageQuestion=0;if(fastImageUrl){URL.revokeObjectURL(fastImageUrl);fastImageUrl=null;}render();}
function fastPreview(){if(!fastPagesReady)return '';return `<div class="fast-preview"><div class="fast-head"><strong>問${state.index+1} ・ 高速表示</strong><div class="fast-controls"><button type="button" class="btn sm" data-action="zoom-out">縮小 −</button><button type="button" class="btn sm" data-action="zoom-in">拡大 ＋</button></div></div><div class="fast-scroll" id="fastScroll"><div class="fast-loading" id="fastLoading">問題画像を読み込み中…</div><img id="fastQuestionImage" alt="問${state.index+1}の問題文と選択肢" style="display:none"/></div></div><p class="fast-note">見づらいときは「拡大＋」を押してください。画像は端末内のみで保存・表示します。</p>`;}
async function displayFastImage(){if(!fastPagesReady||tab!=='answer')return;const n=state.index+1;const myGeneration=++fastImageGeneration;const img=document.getElementById('fastQuestionImage');if(!img)return;
 if(fastImageQuestion===n&&fastImageUrl){img.src=fastImageUrl;img.style.width=Math.round(fastZoom*100)+'%';img.style.display='block';document.getElementById('fastLoading')?.remove();return;}
 try{const blob=await getFastImage(n);if(!blob)throw Error('画像が見つかりません');if(myGeneration!==fastImageGeneration||tab!=='answer'||state.index+1!==n)return;
 const url=URL.createObjectURL(blob),old=fastImageUrl;fastImageUrl=url;fastImageQuestion=n;
 if(old)URL.revokeObjectURL(old);
 const target=document.getElementById('fastQuestionImage');if(!target)return;
 target.src=url;target.style.width=Math.round(fastZoom*100)+'%';target.style.display='block';document.getElementById('fastLoading')?.remove();
 }catch(e){if(myGeneration!==fastImageGeneration)return;const place=document.getElementById('fastLoading');if(place)place.textContent='問題画像を表示できません。再登録するか「PDFで開く」をお試しください。';console.warn(e);}}
function adjustFastZoom(dir){fastZoom=Math.max(1,Math.min(3,Math.round((fastZoom+dir*.4)*10)/10));const im=document.getElementById('fastQuestionImage');if(im)im.style.width=Math.round(fastZoom*100)+'%';}
function openQuestionPdf(n){if(!pdfObjectUrl){alert('まず「問題PDFを登録」から、公式PDFを選択してください。');return;}const u=pdfObjectUrl+'#page='+PAGE_BY_QUESTION[n];const tab=window.open(u,'_blank','noopener');if(!tab){alert('PDFを開けませんでした。Safariでポップアップを許可するか、PDFを「ファイル」アプリから開いてください。');}}
function pdfSource(){return `<p>${fastPagesReady?'<strong>問題文を高速表示中</strong>。選択肢を確認して下のア〜エを選んでください。':'問題文は<strong>公式問題PDF</strong>で確認します。高速表示データを取り込むと、1問ごとに画像を直接表示できます。'}</p>${fastPreview()}<div class="pdf-actions"><button type="button" class="btn sm" data-action="fast-pick">${fastPagesReady?'高速表示データを再登録':'高速表示データを登録（初回だけ）'}</button><button type="button" class="btn sm" data-action="pdf-pick">${pdfReady?'PDF差し替え':'PDF登録（任意）'}</button><button type="button" class="btn sm" data-action="open-pdf" ${pdfReady?'':'disabled'}>PDFで開く ↗</button></div><span class="pdf-status ${fastPagesReady||pdfReady?'ready':'wait'}">${fastPagesReady?'高速表示データ登録済み（80問・端末保存）':pdfBusy?'データ確認中…':pdfReady?'PDF登録済み。高速表示データを追加すると切替が速くなります。':'表示データ未登録：高速表示データを選択してください。'}</span><span class="muted tiny" style="display:block;margin-top:9px">問題画像・PDFは端末にだけ保存され、GitHubへ送信されません。正答は提出するまで表示されません。</span>`;}

function renderMobileDock(){const d=document.getElementById('mobileDock');if(!d)return;d.innerHTML=tab!=='answer'?'':`<button class="btn" data-action="prev" ${state.index===0?'disabled':''}>← 前へ</button><button class="btn primary" data-action="${fastPagesReady?'fast-focus':'open-pdf'}" ${fastPagesReady||pdfReady?'':'disabled'}>${fastPagesReady?'問題を見る':'PDFを開く'}</button><button class="btn" data-action="next" ${state.index===79?'disabled':''}>次へ →</button>`;}
function fresh(){return {version:1,index:0,answers:Array(80).fill(null),confidence:Array(80).fill(null),elapsed:0,runningSince:null,finishedAt:null,createdAt:new Date().toISOString()};}
let state=load();let tab='answer',filter='all';
function load(){try{const o=JSON.parse(localStorage.getItem(STORE));if(!o || !Array.isArray(o.answers) || o.answers.length!==80)return fresh();return { ...fresh(),...o,answers:o.answers.map(x=>KANA.includes(x)?x:null),confidence:Array.isArray(o.confidence)&&o.confidence.length===80?o.confidence:Array(80).fill(null), index:Math.min(79,Math.max(0,Number(o.index)||0))};}catch(e){return fresh();}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){window.alert('保存に失敗しました。ブラウザの保存容量やプライベートモードを確認し、JSONバックアップを保存してください。');}}
function fmtTime(ms){const s=Math.floor(Math.max(0,ms)/1000);return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function elapsed(){return state.elapsed+(state.runningSince?Math.max(0,Date.now()-state.runningSince):0);}
function countAnswered(start=0,end=80){return state.answers.slice(start,end).filter(Boolean).length;}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rowDomain(start,end,name){let n=countAnswered(start,end),d=end-start;return `<div class="statrow"><div class="statline"><span>${name}</span><strong>${n} / ${d}</strong></div><div class="track"><div class="fill" style="width:${100*n/d}%"></div></div></div>`;}
function navigate(i){fastZoom=1;state.index=Math.min(79,Math.max(0,i));tab='answer';save();render();window.scrollTo({top:0,behavior:'smooth'});}
function renderSidebar(){const answered=countAnswered();document.getElementById('sidebar').innerHTML=`<section class="panel padded"><div class="progress-head"><h2 style="margin:0">解答の進捗</h2><span class="muted small">${Math.round(answered/80*100)}%</span></div><div class="big">${answered}<span style="font-size:16px;color:#8796a5;font-weight:550"> / 80問</span></div><div class="track" style="margin-top:8px"><div class="fill" style="width:${answered/80*100}%"></div></div>${rowDomain(0,28,'ストラテジ系')}${rowDomain(28,48,'マネジメント系')}${rowDomain(48,80,'テクノロジ系')}</section><section class="panel padded"><h2>試験タイマー</h2><div class="timerbox"><div id="clock" class="clock">${fmtTime(elapsed())}</div><button class="btn sm ${state.runningSince?'':'primary'}" data-action="timer" ${state.finishedAt?'disabled':''}>${state.runningSince?'一時停止':'開始 / 再開'}</button></div><p class="footerhint">目安120分。タイマーはページを閉じても、開始時刻からの経過時間を計測します。提出時に自動停止します。</p></section><section class="panel navigator"><div class="nav-title"><h2 style="margin:0">問題一覧</h2><span class="muted tiny">番号を選択して移動</span></div><div class="legend"><span><i class="done"></i>解答済み</span><span><i></i>未回答</span><span><i class="current"></i>表示中</span></div><div class="navgrid">${ROWS.map((r,i)=>`<button type="button" data-action="nav" data-index="${i}" title="問${r.n}：${esc(r.topic)}" class="${state.answers[i]?'done ':''}${state.index===i?'current':''}">${r.n}</button>`).join('')}</div><div class="hr"></div><div class="actions"><button class="btn primary full" data-action="finish">${state.finishedAt?'集計結果を見る':'解答を確定・採点する'}</button><button class="btn full" data-action="export-json">進捗のバックアップ（JSON）</button><div class="utilities"><button class="btn sm" data-action="import-json">バックアップ読込</button><button class="btn sm" data-action="export-csv">解答CSV出力</button></div><button class="btn sm danger" data-action="reset">すべて初期化</button></div><div class="footerhint">解答は基本的にこのブラウザ内に自動保存されます。Safariとホーム画面に追加したWebアプリでデータが共有されない場合があります。演習開始前にホーム画面へ追加し、同じアイコンから利用してください。別端末への引継ぎにはJSONバックアップを利用してください。</div></section>`;}
function renderAnswer(){const r=ROWS[state.index],a=state.answers[state.index],c=state.confidence[state.index],locked=!!state.finishedAt;return `<div class="main-inner"><div class="qtop"><div class="qnum">問${r.n}<span style="font-size:14px;color:#8293a4;font-weight:500"> / 80</span></div><span class="category ${r.cls}">${r.domain}</span></div><div class="topic">${esc(r.topic)}</div><div class="detail">分類：${esc(r.subcategory)}</div><div class="source-box">${pdfSource()}</div><div class="selection-head">あなたの解答を選択</div><div class="answers">${KANA.map((k,i)=>`<button type="button" class="answer ${a===k?'selected':''}" data-action="answer" data-value="${k}" ${locked?'disabled':''} aria-pressed="${a===k}"><span class="letter">${k}</span>${a===k?'<span style="font-size:12px">選択中</span>':''}</button>`).join('')}</div><div class="confidence"><div class="selection-head" style="margin:0 0 12px">解答の自信度 <span class="muted small" style="font-weight:400">（任意・復習に利用）</span></div><div class="chiprow">${['確信あり','迷った','勘で選択'].map(s=>`<button class="chip ${c===s?'active':''}" data-action="confidence" data-value="${s}" ${locked?'disabled':''}>${s}</button>`).join('')}<button class="btn flat sm" data-action="clear" ${locked?'disabled':''}>解答を消す</button></div></div>${locked?'<div class="banner warn" style="margin-top:20px;margin-bottom:0">解答は提出済みです。初回結果を残すため、解答は変更できません。</div>':''}<div class="qfooter"><span class="steptext">${state.answers[state.index]?'解答済み':'未回答'} ・ キーボード 1〜4 で選択可</span><div class="next"><button class="btn" data-action="prev" ${state.index===0?'disabled':''}>← 前へ</button><button class="btn dark" data-action="next" ${state.index===79?'disabled':''}>次へ →</button></div></div></div>`;}
function resultCalc(){if(!state.finishedAt)return null;return ROWS.map((r,i)=>({...r,answer:state.answers[i],correct:OFFICIAL_KEYS[i],ok:state.answers[i]===OFFICIAL_KEYS[i],confidence:state.confidence[i]}));}
function miniResult(items,name){const n=items.filter(x=>x.ok).length,total=items.length;return `<div class="statrow"><div class="statline"><span>${name}</span><strong>${n}/${total} (${(100*n/total).toFixed(1)}%)</strong></div><div class="track"><div class="fill" style="width:${100*n/total}%"></div></div></div>`;}
function renderResults(){
 const scored=resultCalc(),answered=countAnswered(),blank=80-answered;
 let out=`<div class="main-inner"><div class="qtop"><h2 style="margin:0;font-size:23px">採点・集計結果</h2><span class="category technology">全80問</span></div>`;
 if(!state.finishedAt){out+=`<div class="banner warn" style="margin-top:22px">まだ解答を確定していません。初見演習を守るため、この画面では正答を表示しません。解答を終えたら「解答を確定・採点する」を押してください。</div><button class="btn primary" data-action="finish">解答を確定・採点する</button></div>`;return out;}
 const correct=scored.filter(r=>r.ok).length,wrong=80-correct,unsureCorrect=scored.filter(r=>r.ok && ['迷った','勘で選択'].includes(r.confidence)).length;
 out+=`<div class="muted small" style="margin-top:20px">総合正答率</div><div class="scorebig">${(correct/80*100).toFixed(1)}<span style="font-size:24px">%</span></div><div class="track" style="height:12px;margin-top:8px"><div class="fill" style="width:${correct/80*100}%"></div></div>
 <div class="kpi-grid"><div class="kpi"><div class="muted small">正解</div><div class="value">${correct}問</div></div><div class="kpi"><div class="muted small">不正解・未回答</div><div class="value">${wrong}問</div></div><div class="kpi"><div class="muted small">所要時間</div><div class="value" style="font-size:17px">${fmtTime(elapsed())}</div></div></div>
 <h3 class="section-heading">分野別正答率</h3>${miniResult(scored.slice(0,28),'ストラテジ系')}${miniResult(scored.slice(28,48),'マネジメント系')}${miniResult(scored.slice(48,80),'テクノロジ系')}
 <div class="banner" style="margin-top:22px">復習対象は<strong>${wrong}問の不正解・未回答</strong>に加えて、<strong>${unsureCorrect}問の「迷った・勘で選択」した正解</strong>です。下の絞り込みで確認できます。</div>`;
 const weak=Object.values(scored.reduce((acc,r)=>{let k=r.subcategory;if(!acc[k])acc[k]={name:k,correct:0,total:0,miss:0};acc[k].total++;if(r.ok)acc[k].correct++;else acc[k].miss++;return acc;},{})).filter(r=>r.miss>0).sort((a,b)=>b.miss-a.miss||b.total-a.total).slice(0,8);
 if(weak.length)out+=`<h3 class="section-heading">間違えたテーマの分類（上位8件）</h3><div style="overflow-x:auto"><table class="results-table"><thead><tr><th>分類</th><th>正解 / 出題</th><th>誤答</th></tr></thead><tbody>${weak.map(w=>`<tr><td>${esc(w.name)}</td><td>${w.correct} / ${w.total}</td><td>${w.miss}問</td></tr>`).join('')}</tbody></table></div>`;
 out+=`<h3 class="section-heading">問題別の判定</h3><div class="filterbar"><select class="select" id="resultFilter" aria-label="一覧の絞り込み"><option value="all" ${filter==='all'?'selected':''}>すべての問題</option><option value="wrong" ${filter==='wrong'?'selected':''}>不正解・未回答</option><option value="unsure" ${filter==='unsure'?'selected':''}>迷った・勘で選択</option><option value="blank" ${filter==='blank'?'selected':''}>未回答のみ</option></select></div><div style="overflow-x:auto"><table class="results-table"><thead><tr><th>問題</th><th>分野・テーマ</th><th>解答</th><th>正答</th><th>判定</th></tr></thead><tbody>`;
 let list=scored;
 if(filter==='wrong')list=list.filter(x=>!x.ok);
 if(filter==='unsure')list=list.filter(x=>x.confidence==='迷った'||x.confidence==='勘で選択');
 if(filter==='blank')list=list.filter(x=>!x.answer);
 out+=list.map(r=>`<tr><td><a class="topiclink" href="#" data-action="nav" data-index="${r.n-1}">問${r.n}</a></td><td>${esc(r.topic)}<div class="tiny muted">${esc(r.domain)}${r.confidence?' ・ '+esc(r.confidence):''}</div></td><td>${r.answer||'—'}</td><td>${r.correct}</td><td>${r.ok?'<span class="tag">正解</span>':'<span class="tag bad">不正解</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">条件に一致する問題がありません。</td></tr>';
 out+=`</tbody></table></div><div class="hr"></div><div class="actions"><button class="btn primary" data-action="export-csv">採点結果をCSV保存</button><button class="btn" data-action="export-json">記録をJSON保存</button></div><p class="footerhint">採点は提供いただいた「オリジナル予想問題vol.2 解答例」に基づきます。初回結果を維持するため、提出後は解答を変更できません。再演習する場合はバックアップを保存後に初期化してください。</p></div>`;
 return out;
}
function render(){renderSidebar();renderMobileDock();document.getElementById('main').innerHTML=`<div class="intro"><div><strong>予想問題２ ・ ${countAnswered()}/80問 解答済み</strong><p>問題画像または登録済みPDFを確認して、ア・イ・ウ・エを選択してください。採点は提出後に実施します。</p></div><div class="tabs"><button class="tab ${tab==='answer'?'active':''}" data-action="tab-answer">解答</button><button class="tab ${tab==='results'?'active':''}" data-action="tab-results">結果・集計</button></div></div>`+(tab==='answer'?renderAnswer():renderResults());if(tab==='answer'&&fastPagesReady)void displayFastImage();}
function download(name,contents,mime){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);}
function exportJSON(){download('itpassport_yosou2_backup.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');}
function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"';}
function exportCSV(){const data=[['問題番号','分野','テーマ','分類','自分の解答','自信度','正答','判定']];ROWS.forEach((r,i)=>{const answer=state.answers[i],key=state.finishedAt?OFFICIAL_KEYS[i]:null;data.push([r.n,r.domain,r.topic,r.subcategory,answer||'',state.confidence[i]||'',key||'',key?(answer===key?'正解':'不正解'):'未採点']);});download('itpassport_yosou2_results.csv','\uFEFF'+data.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function handle(action,elem){if(action==='fast-pick'){document.getElementById('fastPagesFile').click();return;}if(action==='fast-focus'){document.getElementById('fastScroll')?.scrollIntoView({behavior:'smooth',block:'center'});return;}if(action==='zoom-in'){adjustFastZoom(1);return;}if(action==='zoom-out'){adjustFastZoom(-1);return;}if(action==='pdf-pick'){document.getElementById('problemFile').click();return;}if(action==='open-pdf'){openQuestionPdf(state.index);return;}if(action==='nav'){navigate(Number(elem.dataset.index));return;}if(action==='prev'){navigate(state.index-1);return;}if(action==='next'){navigate(state.index+1);return;}if(action==='tab-answer'){tab='answer';render();return;}if(action==='tab-results'){tab='results';render();return;}
if(action==='answer'&& !state.finishedAt){state.answers[state.index]=elem.dataset.value;save();render();return;}
if(action==='confidence'&& !state.finishedAt){const val=elem.dataset.value;state.confidence[state.index]=state.confidence[state.index]===val?null:val;save();render();return;}
if(action==='clear'&& !state.finishedAt){state.answers[state.index]=null;state.confidence[state.index]=null;save();render();return;}
if(action==='timer'){if(state.finishedAt){alert('提出済みのためタイマーは再開できません。');return;}if(state.runningSince){state.elapsed=elapsed();state.runningSince=null;}else{state.runningSince=Date.now();}save();render();return;}
if(action==='finish'){if(state.finishedAt){tab='results';render();return;}let missing=80-countAnswered();if(!confirm(`解答を確定して採点します。${missing?'\n未回答は '+missing+' 問あります。':''}\n\n採点後は初回スコアの記録を守るため解答を変更できません。`))return;state.elapsed=elapsed();state.runningSince=null;state.finishedAt=new Date().toISOString();save();tab='results';render();window.scrollTo({top:0,behavior:'smooth'});return;}
if(action==='export-json'){exportJSON();return;}if(action==='export-csv'){exportCSV();return;}
if(action==='import-json'){document.getElementById('progressFile').click();return;}
if(action==='reset'){if(!confirm('解答・時間・提出済みの採点結果をすべて初期化します。\n初期化前にJSONバックアップを保存してください。\n本当に初期化しますか？'))return;state=fresh();tab='answer';filter='all';save();render();return;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.tagName==='A')e.preventDefault();handle(b.dataset.action,b);});
document.addEventListener('change',async e=>{if(e.target.id==='resultFilter'){filter=e.target.value;render();return;}const file=e.target.files?.[0];if(!file)return;if(e.target.id==='fastPagesFile'){try{await importFastPages(file);alert('高速表示データ80問を登録しました。次の問題への切替が速くなります。');}catch(ex){alert('高速表示データの登録に失敗しました。\n'+ex.message);}finally{e.target.value='';}return;}if(e.target.id==='problemFile'){try{if(!(/\.pdf$/i.test(file.name)||file.type==='application/pdf'))throw Error('PDFファイルを選択してください。');await savePdfFile(file);setPdfUrl(file);alert('問題PDFをこの端末に登録しました。');}catch(ex){alert('PDFの登録に失敗しました。\n'+ex.message);}finally{e.target.value='';}return;}try{const txt=await file.text();if(e.target.id==='progressFile'){let o=JSON.parse(txt);if(!o||!Array.isArray(o.answers)||o.answers.length!==80)throw Error('このアプリの80問バックアップJSONではありません。');if(!confirm('現在の解答をバックアップ内容で上書きしますか？'))return;state={...fresh(),...o,answers:o.answers.map(v=>KANA.includes(v)?v:null),confidence:Array.isArray(o.confidence)&&o.confidence.length===80?o.confidence:Array(80).fill(null),index:Math.min(79,Math.max(0,Number(o.index)||0)),runningSince:null};tab=state.finishedAt?'results':'answer';save();render();alert('バックアップを復元しました。');}}catch(ex){alert('ファイルの読み込みに失敗しました。\n'+ex.message);}finally{e.target.value='';}});
document.addEventListener('keydown',e=>{if(tab!=='answer'||state.finishedAt||e.altKey||e.metaKey||e.ctrlKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(['1','2','3','4'].includes(e.key)){e.preventDefault();state.answers[state.index]=KANA[Number(e.key)-1];save();render();}else if(e.key==='ArrowRight'&&state.index<79){e.preventDefault();navigate(state.index+1);}else if(e.key==='ArrowLeft'&&state.index>0){e.preventDefault();navigate(state.index-1);}});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("Offline unavailable",e)));}
initPdf();
initFastPages();
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=fmtTime(elapsed());},1000);
render();
</script>
</body></html>
